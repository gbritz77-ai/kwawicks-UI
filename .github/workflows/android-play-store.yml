name: Android - Play Store

on:
  workflow_dispatch:   # trigger manually from GitHub Actions tab
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package*.json'
      - 'vite.config.ts'

jobs:
  build-and-publish:
    name: Build AAB & publish to Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build React app
        run: npm run build

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > kwawicks-release.keystore

      # Gradle init script applied globally (before any project build.gradle) so it
      # reaches ALL subprojects including capacitor-android in node_modules.
      # Cordova 10.x depends on kotlin-stdlib-jdk7/jdk8:1.6.x which conflicts with
      # the 1.8.22 stdlib (jdk7/jdk8 classes merged into main artifact in 1.8).
      - name: Patch Kotlin stdlib conflict via Gradle init script
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/kotlin-compat.gradle << 'GROOVY'
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          if (details.requested.module.name == 'kotlin-stdlib-jdk7' ||
                              details.requested.module.name == 'kotlin-stdlib-jdk8') {
                              details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                              details.because 'kotlin 1.8+ merged jdk7/jdk8 into the main stdlib'
                          }
                      }
                  }
              }
          }
          GROOVY

      - name: Sync Capacitor
        run: |
          rm -rf android/app/src/main/assets/public
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Bump versionCode
        run: |
          VERSION_CODE=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          echo "Version code set to $VERSION_CODE"

      # Signing is configured in android/app/build.gradle (storeFile resolves relative
      # to android/app/ so ../../kwawicks-release.keystore = workspace root).
      # Do NOT use -Pandroid.injected.signing.* flags - they resolve relative to the
      # Gradle daemon directory and produce the wrong path.
      - name: Build Android AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwawicks-release-${{ github.run_number }}.aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Publish to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS }}
          packageName: co.za.outsec.kwawicks
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
